# nginx site for https://api.leatherluxindia.com  ->  the LLX API on 127.0.0.1:4000
#
# Install:
#   sudo cp nginx-api.conf /etc/nginx/sites-available/llx-api
#   sudo ln -s /etc/nginx/sites-available/llx-api /etc/nginx/sites-enabled/llx-api
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.leatherluxindia.com      # adds the HTTPS block, the certificate and the http -> https redirect
# The DNS record for api.leatherluxindia.com must already point at this server, or certbot cannot get the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name api.leatherluxindia.com;

    # The API answers JSON up to 20 KB and a logo upload up to 1 MB; 2 MB leaves room without inviting large uploads.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # The API reads the real client address and scheme from these (TRUST_PROXY=1 in .env).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
