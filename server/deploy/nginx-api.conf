# nginx site for https://api.leatherluxindia.com  ->  the LLX API on 127.0.0.1:4000
#
# Install (see deploy/README.md step 6):
#   sudo cp nginx-api.conf /etc/nginx/sites-available/llx-api
#   sudo ln -s /etc/nginx/sites-available/llx-api /etc/nginx/sites-enabled/llx-api
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.leatherluxindia.com      # adds the HTTPS block, the certificate and the http -> https redirect
# The DNS record for api.leatherluxindia.com must already point at this server, or certbot cannot get the certificate.

# A second line of defence in front of the API's own rate limiter: at most 50 requests a second from one address (bursts of 100).
# Product photos are not counted, because one page loads dozens of them.
limit_req_zone $binary_remote_addr zone=llx_api:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name api.leatherluxindia.com;

    # Do not announce which nginx version this is.
    server_tokens off;

    # The API answers JSON up to 20 KB and a logo upload up to 1 MB; 2 MB leaves room without inviting large uploads.
    client_max_body_size 2m;
    # Drop slow or stalled clients instead of holding connections open for them.
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;

    # Settings shared by both locations below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API reads the real client address and scheme from these (TRUST_PROXY=1 in .env).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location /media/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        limit_req zone=llx_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:4000;
    }
}
